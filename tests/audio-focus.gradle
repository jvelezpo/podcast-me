// Run from android/: ./gradlew :expo-audio:testDebugUnitTest --init-script ../tests/audio-focus.gradle
gradle.beforeProject { project ->
  if (project.name == 'expo-audio') {
    project.afterEvaluate {
      project.android.sourceSets.test.java.srcDir(
        new File(project.rootProject.projectDir.parentFile, 'tests/android')
      )
      project.android.testOptions.unitTests.includeAndroidResources = true
      project.android.testOptions.unitTests.all {
        systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
      }
      project.dependencies.add('testImplementation', 'junit:junit:4.13.2')
      project.dependencies.add('testImplementation', 'org.robolectric:robolectric:4.16.1')
    }
  }
}
